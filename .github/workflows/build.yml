name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux:
    name: Android APK + Linux AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub secret KEYSTORE_BASE64 (base64 of ~/.keystores/babycam-view.keystore)."
            exit 1
          fi
          mkdir -p "$HOME/.keystores"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.keystores/babycam-view.keystore"
          chmod 600 "$HOME/.keystores/babycam-view.keystore"

      - name: Build Android APK + Linux AppImage
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./build_release.sh

      - name: Commit version bump back to branch
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/version.properties
          if git diff --cached --quiet; then
            echo "version.properties unchanged - nothing to commit"
          else
            git commit -m "chore: bump versionCode for ${GITHUB_REF_NAME}"
            BRANCH="$(git branch -r --contains HEAD | sed -n '1p' | sed 's/.*origin\///' | tr -d ' ')"
            if [ -n "$BRANCH" ]; then
              git push origin "HEAD:$BRANCH"
            else
              echo "::warning::Could not determine target branch for version.properties commit"
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build_release/*_android.apk
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: build_release/*_x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1].replace(/^v/,'');fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n','utf8')" "${{ github.ref_name }}"

      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/apk
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/appimage
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/apk/*.apk
            artifacts/appimage/*.AppImage
            artifacts/windows/*.exe
